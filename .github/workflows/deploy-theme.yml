name: Deploy Theme to Shopify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      theme_id:
        description: 'Target theme ID (leave blank for live theme)'
        required: false

jobs:
  deploy:
    name: Push Theme to Shopify
    runs-on: ubuntu-latest
    # Skip shopify[bot] commits to prevent sync loops
    if: github.actor != 'shopify[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get live theme ID
        if: ${{ !github.event.inputs.theme_id }}
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          THEME_ID=$(curl -s \
            -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
            "https://${SHOPIFY_STORE}/admin/api/2024-10/themes.json" \
            | python3 -c "import sys,json; themes=json.load(sys.stdin)['themes']; print(next(t['id'] for t in themes if t['role']=='main'))")
          echo "THEME_ID=$THEME_ID" >> $GITHUB_ENV
          echo "Deploying to live theme: $THEME_ID"

      - name: Use specified theme ID
        if: ${{ github.event.inputs.theme_id }}
        run: |
          echo "THEME_ID=${{ github.event.inputs.theme_id }}" >> $GITHUB_ENV
          echo "Deploying to theme: ${{ github.event.inputs.theme_id }}"

      - name: Upload theme files
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          ERRORS=0

          upload_file() {
            local file_path="$1"
            local key="$file_path"
            local content
            content=$(cat "$file_path")

            local response
            response=$(curl -s -w "\n%{http_code}" \
              -X PUT \
              -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://${SHOPIFY_STORE}/admin/api/2024-10/themes/${THEME_ID}/assets.json" \
              -d "$(python3 -c "
          import json, sys
          with open('$file_path', 'r') as f:
              content = f.read()
          print(json.dumps({'asset': {'key': '$key', 'value': content}}))
          ")")

            local http_code
            http_code=$(echo "$response" | tail -1)
            local body
            body=$(echo "$response" | sed '$d')

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "  ✓ $key"
            else
              echo "  ✗ $key (HTTP $http_code)"
              echo "    $body" | head -2
              ERRORS=$((ERRORS + 1))
            fi
          }

          echo "Uploading theme files to theme $THEME_ID..."
          echo ""

          # Upload all theme files by directory
          for dir in layout config sections snippets templates templates/metaobject templates/customers assets; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                if [ -f "$file" ]; then
                  upload_file "$file"
                  # Rate limit: Shopify allows 2 requests/second for asset API
                  sleep 0.5
                fi
              done
            fi
          done

          echo ""
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS file(s) failed to upload"
            exit 1
          else
            echo "All files deployed successfully."
          fi
